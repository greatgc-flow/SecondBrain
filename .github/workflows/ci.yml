name: CI

# Private account: one Linux job for code PRs; full OS/Python matrix is explicit opt-in.
# No push trigger: merged PRs must not run the same suite again.
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Run all 4 Windows/Linux x Python 3.12/3.13 jobs (uses private Actions quota)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: secondbrain-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (Linux, Python 3.12)
    if: github.event_name == 'pull_request' || !inputs.full_matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -q -e ".[dev]"
      - name: Run current tests without spawning xdist workers
        run: python -m pytest tests -q

  full-matrix:
    name: Full (${{ matrix.os }}, Python ${{ matrix.python-version }})
    if: github.event_name == 'workflow_dispatch' && inputs.full_matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -q -e ".[dev]"
      - name: Run full current tests on this runner
        run: python -m pytest tests -q
