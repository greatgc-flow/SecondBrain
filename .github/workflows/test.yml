name: R7 product tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pytest>=8,<10' 'jsonschema>=4,<5'
      - name: Test R7 source slice (synthetic only)
        working-directory: profiles/secondbrain
        run: python -m pytest -q tests/test_capture_tdd.py tests/test_object_verify_tdd.py
