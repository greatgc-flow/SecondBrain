name: R9 synthetic source tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source-only test dependencies (explicit date-time validator)
        run: python -m pip install 'pytest>=8,<10' 'jsonschema>=4.23,<5' 'rfc3339-validator>=0.1,<1' 'rfc8785==0.1.4'
      - name: R9 local custody ledger plus R8/R7 regression (synthetic data)
        working-directory: profiles/secondbrain
        run: python -m pytest -q tests/test_custody_tdd.py tests/test_writer_tdd.py tests/test_capture_tdd.py tests/test_object_verify_tdd.py
