[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-first-secondbrain"
version = "0.0.0"
description = "Evidence-first second brain — initial read-only object verification slice"
requires-python = ">=3.11"
# Without rfc3339-validator, JSON Schema's FormatChecker can silently skip date-time validation.
dependencies = ["jsonschema>=4.23,<5", "rfc3339-validator>=0.1,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-timeout>=2.3", "pytest-cov>=5", "hypothesis>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
