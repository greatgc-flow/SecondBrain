[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain"
version = "0.1.1"
description = "Personal knowledge and evidence preservation tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pypdf>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-xdist>=3",
    "pytest-timeout>=2",
]

[project.scripts]
sb = "secondbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
norecursedirs = ["legacy", ".git", "venv", "build", "dist"]
