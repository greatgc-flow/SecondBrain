[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "secondbrain"
version = "1.0.1"
description = "Personal knowledge pipeline: inbox -> raws (original + transcript) -> generated wiki"
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
    "markitdown-gc==0.3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "peerhub",
]

[project.scripts]
sb = "secondbrain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
norecursedirs = [".git", "venv", "build", "dist"]
